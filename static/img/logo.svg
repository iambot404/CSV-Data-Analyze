<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 40" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  
  <!-- Icon Symbol: Isometric CSV Grid with AI Spark -->
  <g transform="translate(6, 4)" filter="url(#logoGlow)">
    <rect x="0" y="0" width="32" height="32" rx="8" fill="#1e293b" stroke="url(#logoGrad)" stroke-width="1.8" />
    <!-- Grid Cells -->
    <rect x="5" y="6" width="9" height="7" rx="2" fill="url(#logoGrad)" fill-opacity="0.85" />
    <rect x="18" y="6" width="9" height="7" rx="2" fill="#334155" />
    <rect x="5" y="16" width="9" height="7" rx="2" fill="#334155" />
    <rect x="18" y="16" width="9" height="7" rx="2" fill="url(#logoGrad)" fill-opacity="0.85" />
    <!-- Center AI Sparkle -->
    <circle cx="16" cy="15" r="2.5" fill="#38bdf8" />
  </g>
  
  <!-- Text Brand -->
  <text x="48" y="22" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="800" font-size="16" fill="#f8fafc" letter-spacing="-0.3">
    SYNAPSE<tspan fill="url(#logoGrad)">CSV</tspan>
  </text>
  <text x="49" y="31" font-family="'Inter', 'Segoe UI', sans-serif" font-weight="600" font-size="8" fill="#94a3b8" letter-spacing="1.5">
    AI DATA ANALYZER
  </text>
</svg>
