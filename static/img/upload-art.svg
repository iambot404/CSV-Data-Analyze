<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" fill="none">
  <defs>
    <linearGradient id="upGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="60%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="sheetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="beamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.8" />
    </linearGradient>
    <filter id="upGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient background glow aura -->
  <circle cx="160" cy="110" r="85" fill="#6366f1" fill-opacity="0.12" filter="url(#upGlow)" />
  <circle cx="180" cy="80" r="50" fill="#06b6d4" fill-opacity="0.15" filter="url(#upGlow)" />

  <!-- Upward light beam stream -->
  <polygon points="120,180 200,180 220,40 100,40" fill="url(#beamGrad)" />

  <!-- Base Grid Platform / Shadow -->
  <ellipse cx="160" cy="180" rx="90" ry="24" fill="#030712" fill-opacity="0.7" />
  
  <!-- Floating CSV Sheet Isometric -->
  <g transform="translate(70, 45)">
    <!-- Back Sheet Shadow -->
    <rect x="10" y="10" width="160" height="110" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1.2" />
    <!-- Main Sheet -->
    <rect x="0" y="0" width="160" height="110" rx="12" fill="url(#sheetGrad)" stroke="#475569" stroke-width="1.5" />
    
    <!-- Sheet Header Bar -->
    <rect x="0" y="0" width="160" height="28" rx="12" fill="#1e293b" />
    <circle cx="14" cy="14" r="3.5" fill="#ef4444" />
    <circle cx="26" cy="14" r="3.5" fill="#f59e0b" />
    <circle cx="38" cy="14" r="3.5" fill="#10b981" />
    <text x="56" y="17" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#94a3b8" letter-spacing="0.5">DATASET.CSV</text>
    
    <!-- CSV Row Lines with glowing cells -->
    <!-- Row 1 -->
    <rect x="12" y="38" width="36" height="10" rx="3" fill="#38bdf8" fill-opacity="0.25" />
    <rect x="54" y="38" width="46" height="10" rx="3" fill="#6366f1" fill-opacity="0.25" />
    <rect x="106" y="38" width="42" height="10" rx="3" fill="#a855f7" fill-opacity="0.25" />
    
    <!-- Row 2 -->
    <rect x="12" y="54" width="42" height="10" rx="3" fill="#334155" />
    <rect x="60" y="54" width="38" height="10" rx="3" fill="#06b6d4" fill-opacity="0.3" />
    <rect x="104" y="54" width="44" height="10" rx="3" fill="#334155" />

    <!-- Row 3 -->
    <rect x="12" y="70" width="32" height="10" rx="3" fill="#334155" />
    <rect x="50" y="70" width="50" height="10" rx="3" fill="#334155" />
    <rect x="106" y="70" width="42" height="10" rx="3" fill="#6366f1" fill-opacity="0.3" />

    <!-- Row 4 -->
    <rect x="12" y="86" width="48" height="10" rx="3" fill="#38bdf8" fill-opacity="0.2" />
    <rect x="66" y="86" width="38" height="10" rx="3" fill="#334155" />
    <rect x="110" y="86" width="38" height="10" rx="3" fill="#a855f7" fill-opacity="0.2" />
  </g>

  <!-- Upload Icon / Floating Badge -->
  <g transform="translate(132, 120)" filter="url(#upGlow)">
    <circle cx="28" cy="28" r="26" fill="#0f172a" stroke="url(#upGrad)" stroke-width="2.5" />
    <!-- Arrow Up Vector -->
    <path d="M28 17 L19 26 L24 26 L24 37 L32 37 L32 26 L37 26 Z" fill="url(#upGrad)" />
  </g>

  <!-- Floating Satellite Chips / Decorative Mini Charts -->
  <!-- Chip 1: Mini bar chart -->
  <g transform="translate(35, 95)" filter="url(#upGlow)">
    <rect x="0" y="0" width="48" height="38" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <rect x="8" y="20" width="6" height="12" rx="1.5" fill="#38bdf8" />
    <rect x="18" y="12" width="6" height="20" rx="1.5" fill="#6366f1" />
    <rect x="28" y="6" width="6" height="26" rx="1.5" fill="#a855f7" />
    <circle cx="38" cy="10" r="2" fill="#38bdf8" />
  </g>

  <!-- Chip 2: AI Sparkle Tag -->
  <g transform="translate(240, 60)">
    <rect x="0" y="0" width="54" height="28" rx="7" fill="#1e293b" stroke="#a855f7" stroke-width="1" />
    <circle cx="12" cy="14" r="4" fill="#06b6d4" />
    <line x1="22" y1="11" x2="44" y2="11" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />
    <line x1="22" y1="18" x2="36" y2="18" stroke="#64748b" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Floating particles -->
  <circle cx="65" cy="50" r="2.5" fill="#38bdf8" />
  <circle cx="265" cy="145" r="3" fill="#c084fc" />
  <circle cx="100" cy="18" r="2" fill="#818cf8" />
  <circle cx="215" cy="22" r="2" fill="#38bdf8" />
</svg>
