<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" fill="none">
  <defs>
    <radialGradient id="meshGrad1" cx="20%" cy="10%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="meshGrad2" cx="80%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.16" />
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="meshGrad3" cx="50%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0" />
    </radialGradient>
    <pattern id="gridPattern" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.35" />
      <circle cx="48" cy="48" r="1" fill="#64748b" fill-opacity="0.4" />
    </pattern>
  </defs>

  <!-- Deep Background -->
  <rect width="1440" height="900" fill="#090d16" />

  <!-- Gradient Atmosphere Clouds -->
  <rect width="1440" height="900" fill="url(#meshGrad1)" />
  <rect width="1440" height="900" fill="url(#meshGrad2)" />
  <rect width="1440" height="900" fill="url(#meshGrad3)" />

  <!-- Grid Pattern Overlay -->
  <rect width="1440" height="900" fill="url(#gridPattern)" />

  <!-- Abstract Vector Geometric Data Paths -->
  <g stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.2" stroke-dasharray="6 6">
    <path d="M -100 250 C 300 150, 600 400, 1000 200 S 1400 350, 1600 280" />
    <path d="M -100 550 C 400 700, 800 500, 1200 650 S 1500 520, 1600 560" stroke="#a855f7" stroke-opacity="0.18" />
  </g>

  <!-- Floating Vector Data Nodes -->
  <circle cx="340" cy="180" r="3.5" fill="#06b6d4" fill-opacity="0.6" />
  <circle cx="780" cy="310" r="4" fill="#8b5cf6" fill-opacity="0.5" />
  <circle cx="1120" cy="220" r="3" fill="#38bdf8" fill-opacity="0.6" />
  <circle cx="950" cy="580" r="3.5" fill="#a855f7" fill-opacity="0.5" />
</svg>
